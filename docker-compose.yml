version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: familylink-postgres
    restart: always
    environment:
      POSTGRES_USER: familylink
      POSTGRES_PASSWORD: familylink_password
      POSTGRES_DB: familylink_db
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: familylink-redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
