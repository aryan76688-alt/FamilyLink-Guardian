name: Deploy to Railway

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    name: Trigger Railway Up
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Deploy API Service
        run: railway up --service familylink-api --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      - name: Deploy Web Dashboard
        run: railway up --service familylink-web --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      - name: Deploy Worker Daemon
        run: railway up --service familylink-worker --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
