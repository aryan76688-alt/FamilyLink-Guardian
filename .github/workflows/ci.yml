name: FamilyLink Guardian CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test-api:
    name: Backend API Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: api/package.json
      - name: Install Dependencies
        run: cd api && npm ci --legacy-peer-deps
      - name: Generate Prisma Client
        run: cd api && npx prisma generate
      - name: Compile NestJS
        run: cd api && npm run build

  test-web:
    name: Web Dashboard Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package.json
      - name: Install Dependencies
        run: cd web && npm ci --legacy-peer-deps
      - name: Build Next.js
        run: cd web && npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.familylink.example.com
          NEXT_PUBLIC_WS_URL: wss://api.familylink.example.com

  test-worker:
    name: Worker Service Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: worker/package.json
      - name: Install Dependencies
        run: cd worker && npm ci
      - name: Compile Worker TypeScript
        run: cd worker && npm run build

  android-verify:
    name: Android Apps Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
